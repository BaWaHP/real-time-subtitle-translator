[project]
name = "real-time-subtitle-translator"
version = "0.2.3"
description = "English-to-Chinese subtitles for Windows audio and Edge videos"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".runtime"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
